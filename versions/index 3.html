<title>Archive</title>
<style>
:root { --bg: #111111; --fg: #e8e8e8; --link: #9fc0ff; --mono: ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--link); }
h1 { font: inherit; font-weight: 700; margin: 0; }
p { max-width: 72ch; margin: 0 0 10px; }
section { margin-top: 40px; }
h2 { font: 700 clamp(28px, 5vw, 52px)/1.05 Helvetica, Arial, sans-serif; letter-spacing: -0.04em; margin: 0 0 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.tiles img { display: block; width: 100%; height: auto; border: 1px solid var(--fg); }
@media (max-width: 700px) { .tiles { grid-template-columns: 1fr; } }
</style>
</head>
